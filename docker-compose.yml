# Stack tecnológico 02 · orquestación local
# docker compose up -d --build   →   http://localhost:8080

name: stack02

# Variables de conexión compartidas por las tres aplicaciones (ancla YAML)
x-bd: &bd
  DB_HOST: sqlserver
  DB_PORT: "1433"
  DB_NAME: stack02
  DB_USER: stack_app
  DB_PASSWORD: ${APP_PASSWORD:-App02*Clave}

services:
  # Base de datos
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Stack02*Clave}
    ports:
      - "1433:1433"
    volumes:
      - datos-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Un solo uso: crea la base, carga los datos y el usuario de las aplicaciones
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD:-Stack02*Clave}
      - -C
      - -b
      - -f
      - "65001"
      - -v
      - APP_PASSWORD=${APP_PASSWORD:-App02*Clave}
      - -i
      - /db/01_esquema.sql,/db/02_datos.sql,/db/03_seguridad.sql
    restart: "no"

  # API JSON
  fastapi:
    build: ./fastapi
    environment:
      <<: *bd
      ORIGENES_PERMITIDOS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Monitor Jakarta EE
  wildfly:
    build: ./wildfly
    environment:
      <<: *bd
      FASTAPI_URL: http://fastapi:8000
      CODEIGNITER_URL: http://codeigniter
      ORIGEN_PERMITIDO: http://localhost:8080
    ports:
      - "8081:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Sitio MVC
  codeigniter:
    build:
      context: .
      dockerfile: codeigniter/Dockerfile
    environment:
      <<: *bd
      CI_ENVIRONMENT: production
      app_baseURL: http://localhost:8080/
      PUBLIC_API_URL: http://localhost:8000
      PUBLIC_MONITOR_URL: http://localhost:8081/monitor
      PROYECTO_DIR: /proyecto
    ports:
      - "8080:80"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/salud"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  datos-sql:
